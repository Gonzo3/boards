<style>
:root{--bg:#F2F4F1;--ink:#1D2B2E;--sub:#5B6E6D;--card:#fff;--brand:#0E6E74;--line:#1D2B2E1F}
@media(prefers-color-scheme:dark){:root{--bg:#0F1719;--ink:#E4EAE6;--sub:#97A8A6;--card:#172124;--line:#E4EAE626}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:48px 16px}
h1{font-family:Futura,"Avenir Next",sans-serif;font-size:1.6rem}
a.board{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink);margin:12px 0}
a.board b{color:var(--brand)}
a.board span{display:block;color:var(--sub);font-size:.85rem}
</style>
